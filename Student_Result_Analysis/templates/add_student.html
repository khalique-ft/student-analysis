{% extends "base.html" %}

{% block title %}Add Student - Student Result Analysis{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New Student</h2>

    <form method="POST" action="{{ url_for('add_student') }}">
        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter student full name">
        </div>

        <div class="form-group">
            <label for="roll_no">Roll Number *</label>
            <input type="text" id="roll_no" name="roll_no" required placeholder="e.g. 21CS001">
        </div>

        <div class="form-group">
            <label for="class">Class / Section</label>
            <input type="text" id="class" name="class" placeholder="e.g. 10-A or B.Tech CSE">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="student@example.com">
        </div>

        <button type="submit" class="btn btn-primary">Add Student</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
